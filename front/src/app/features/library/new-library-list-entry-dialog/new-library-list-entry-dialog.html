<h2 mat-dialog-title class="dialog-title">Add a library entry</h2>

<mat-dialog-content>
	<div><p>Add a game to the library...</p></div>
	<div class="further-buttons">
		<button mat-flat-button (click)="gotoCatalog()" >... by choosing from the catalog</button>
		<button mat-flat-button (click)="spawnLibraryAndCatalogAddDialog()" >... by creating a catalog entry right here</button>
	</div>
</mat-dialog-content>

<mat-dialog-actions align="end">
	<button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
