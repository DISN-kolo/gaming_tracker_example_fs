<div class="library-list-entry" (click)="openDetailDialog()">
	<div class="library-list-entry__header">
		<span class="library-list-entry__title">{{ libraryEntry().title }}</span>
		@if (libraryEntry().releaseYear) {
			<span class="library-list-entry__year">({{ libraryEntry().releaseYear }})</span>
		}
		<span class="spacer"></span>
		<app-game-kebab-menu
			[gameId]="libraryEntry().id"
			[inLibrary]="true"
			[isOwner]="isOwner()"
			[libEntry]="{ status: libraryEntry().status, rating: libraryEntry().rating }"
			(libraryChanged)="libraryChanged.emit()"
			(catalogDeletionHappened) = "onCatalogDeletionHappened()"
		/>
	</div>
	@if (libraryEntry().description) {
		<p class="library-list-entry__description">{{ libraryEntry().description }}</p>
	}
</div>
