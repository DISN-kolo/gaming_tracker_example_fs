<div class="library-list-entry" (click)="openDetailDialog()">
	<div class="library-list-entry__header">
		<span class="library-list-entry__title">{{ libraryElement().title }}</span>
		@if (game().releaseYear) {
			<span class="library-list-entry__year">({{ libraryElement().releaseYear }})</span>
		}
		<span class="spacer"></span>
		<app-game-kebab-menu
			[gameId]="libraryElement().id"
			[inLibrary]="true"
			[isOwner]="isOwner()"
			[libEntry]="{ status: libraryElement().status, rating: libraryElement().rating }"
			(libraryChanged)="libraryChanged.emit()"
			(catalogDeletionHappened) = "onCatalogDeletionHappened()"
		/>
	</div>
	@if (libraryElement().description) {
		<p class="library-list-entry__description">{{ libraryElement().description }}</p>
	}
</div>
