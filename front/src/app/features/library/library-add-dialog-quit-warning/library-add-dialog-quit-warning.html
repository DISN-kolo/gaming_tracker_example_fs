<h2 mat-dialog-title class="dialog-title">Are you sure you want to stop adding the game into your library?</h2>

<mat-dialog-actions align="end">
	<button mat-flat-button class="very-red" (click)="yesAndDeleteGame()">Yes, and delete the catalog entry</button>
	<button mat-flat-button class="mildly-red" (click)="yesAndKeepGame()">Yes, but keep the catalog entry</button>
	<button mat-button mat-dialog-close cdkFocusInitial>No, continue</button>
</mat-dialog-actions>
